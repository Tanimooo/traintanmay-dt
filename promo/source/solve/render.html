<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="/esat/vendor/katex/katex.min.css">
<script src="/esat/vendor/katex/katex.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@500;600;700&display=block" rel="stylesheet">
<style>
:root{--paper:#f6f1e7;--ink:#1b1604;--pop:#ffc917;--ok:#1f9d55;--bad:#e0344b;--line:#1b1604}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--paper);font-family:'IBM Plex Sans',sans-serif;color:var(--ink)}
body{background-image:radial-gradient(rgba(27,22,4,.09) 2px,transparent 2px);background-size:34px 34px}
#top{position:absolute;left:56px;right:56px;top:96px;height:96px;display:flex;align-items:center;gap:20px}
#top img{width:84px;height:84px;border-radius:20px;border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink)}
#top .t1{font:800 40px 'Bricolage Grotesque';line-height:1}
#top .t2{font:600 26px 'IBM Plex Sans';opacity:.7;margin-top:6px}
#tag{margin-left:auto;background:var(--pop);border:3px solid var(--ink);border-radius:999px;padding:10px 22px;font:700 28px 'IBM Plex Sans';box-shadow:0 5px 0 var(--ink);white-space:nowrap}
#card{position:absolute;left:40px;width:1000px;top:222px;background:#fff;border:4px solid var(--ink);border-radius:30px;box-shadow:0 9px 0 var(--ink);overflow:hidden;padding:18px 20px}
#qwrap{position:relative;transform-origin:0 0}
#qwrap img{display:block}
.hl{position:absolute;border:5px solid var(--pop);border-radius:12px;background:rgba(255,201,23,.28);transition:none}
.lbl{position:absolute;transform:translate(-50%,-50%);background:var(--ink);color:#fff;font:700 21px 'IBM Plex Sans';padding:3px 10px;border-radius:10px;white-space:nowrap}
#chips{position:absolute;left:40px;width:930px;display:flex;gap:10px}
.chip{flex:1;background:#fff;border:3px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--ink);text-align:center;padding:10px 2px 8px;position:relative}
.chip b{display:block;font:800 34px 'Bricolage Grotesque';line-height:1}
.chip span{display:block;font:600 22px 'IBM Plex Sans';margin-top:4px;white-space:nowrap}
.chip.right{background:#d9f7e5;border-color:var(--ok);box-shadow:0 5px 0 var(--ok)}
.chip.right b,.chip.right span{color:#0d6b35}
.chip.wrong{background:#fde3e7;border-color:var(--bad);box-shadow:0 5px 0 var(--bad)}
.chip.wrong::after{content:'';position:absolute;left:8px;right:8px;top:50%;height:6px;background:var(--bad);border-radius:3px;transform:rotate(-24deg)}
.chip.right::before{content:'✓';position:absolute;top:-22px;right:-10px;width:44px;height:44px;border-radius:50%;background:var(--ok);color:#fff;font:800 28px/44px 'IBM Plex Sans'}
#work{position:absolute;left:40px;width:900px;overflow:hidden}
.wl{position:absolute;left:0;right:0;padding:10px 0 10px 26px;font-size:40px;border-left:8px solid transparent;white-space:nowrap}
.wl.now{border-left-color:var(--pop)}
.wl.box .katex{border:4px solid var(--ok);border-radius:14px;padding:6px 14px;background:#e8faef}
.wl.trap{color:var(--bad)}
#pause{position:absolute;left:40px;width:900px;display:none;text-align:center}
#pause .p1{font:800 60px 'Bricolage Grotesque'}
#pause .bar{margin:22px auto 0;width:640px;height:22px;border:4px solid var(--ink);border-radius:999px;overflow:hidden;background:#fff}
#pause .bar i{display:block;height:100%;background:var(--pop)}
#cap{position:absolute;left:50px;width:880px;text-align:center;font:700 50px/1.25 'IBM Plex Sans'}
#cap .w{padding:0 4px;border-radius:10px}
#cap .w.on{background:var(--pop)}
#cap.dark{color:#fff}
#cap.dark .inner{display:inline;background:rgba(20,16,3,.86);box-decoration-break:clone;-webkit-box-decoration-break:clone;padding:6px 14px;border-radius:14px;line-height:1.5}
#cap.dark .w.on{color:var(--ink)}
#outro{position:absolute;inset:0;display:none}
#outro img{width:1080px;height:1920px;display:block}
#tap{position:absolute;width:90px;height:90px;margin:-45px 0 0 -45px;border-radius:50%;background:rgba(255,201,23,.55);border:5px solid var(--ink);display:none}
</style></head>
<body>
<div id="main">
  <div id="top"><img src="/icons/icon.svg"><div><div class="t1">TrainTanmay</div><div class="t2" id="series"></div></div><div id="tag"></div></div>
  <div id="card"><div id="qwrap"><img id="qimg"></div></div>
  <div id="chips"></div>
  <div id="pause"><div class="p1">Pause &amp; try it ✋</div><div class="bar"><i></i></div></div>
  <div id="work"></div>
</div>
<div id="outro"><img id="oimg"><div id="tap"></div></div>
<div id="cap"></div>
<script>
const S = window.SCHED; // injected
const $ = id => document.getElementById(id);
const ez = x => x <= 0 ? 0 : x >= 1 ? 1 : 1 - Math.pow(1 - x, 3);
$('series').textContent = S.series + ' · real past question';
$('tag').textContent = S.tag;
const qimg = $('qimg'); qimg.src = S.crop.src;
// card layout: crop scaled to the card's inner width
const CW = 956, sc = CW / S.crop.w, unit = S.crop.w / (S.box[2] - S.box[0]);  // crop px per r110 unit
qimg.style.width = S.crop.w + 'px'; $('qwrap').style.transform = `scale(${sc})`;
const fullH = S.crop.h * sc + 36, capTop = 1395;
// tall questions shrink once the solving starts, to make room for the working
const cmp = S.compact || null;
let workTop = 0, workH = 0;
function layout(t) {
  const k = cmp ? 1 - (1 - cmp.h / fullH) * ez((t - cmp.t) / .6) : 1;
  const cw = 1000 * k + 0 * (1 - k), cardH = fullH * k;
  $('qwrap').style.transform = `scale(${sc * k})`;
  Object.assign($('card').style, { height: cardH + 'px', width: (1000 * k) + 'px', left: (540 - 500 * k) + 'px', padding: `${18 * k}px ${20 * k}px` });
  const chipsTop = 222 + cardH + 28; $('chips').style.top = chipsTop + 'px';
  workTop = chipsTop + 130; workH = capTop - workTop - 16;
  $('work').style.top = workTop + 'px'; $('work').style.height = workH + 'px';
  $('pause').style.top = (workTop + 40) + 'px';
}
$('cap').style.top = capTop + 'px';
const L = 'ABCDEFGH';
S.options.forEach((o, i) => $('chips').insertAdjacentHTML('beforeend', `<div class="chip" id="c${L[i]}"><b>${L[i]}</b><span>${o}</span></div>`));
// marks and labels live in crop pixel space (r110 units × unit)
const P = (x, y) => [x * unit, y * unit];
const hlEls = {};
Object.entries(S.marks).forEach(([k, m]) => {
  const d = document.createElement('div'); d.className = 'hl'; const [x, y] = P(m.x, m.y), pad = 8;
  d.style.borderWidth = (6 / sc) + 'px'; d.style.borderRadius = (12 / sc) + 'px';
  Object.assign(d.style, { left: (x - m.w / 2 * unit - pad) + 'px', top: (y - m.h / 2 * unit - pad) + 'px', width: (m.w * unit + 2 * pad) + 'px', height: (m.h * unit + 2 * pad) + 'px', opacity: 0 });
  $('qwrap').appendChild(d); hlEls[k] = d;
});
const lblEls = {}, workEls = [];
S.events.forEach(e => {
  if (e.do === 'label') { const d = document.createElement('div'); d.className = 'lbl'; d.textContent = e.text; const [x, y] = P(e.x, e.y);
    Object.assign(d.style, { left: x + 'px', top: y + 'px', fontSize: (21 / sc * 1.25) + 'px', padding: `${3 / sc}px ${10 / sc}px`, borderRadius: (10 / sc) + 'px', opacity: 0 });
    $('qwrap').appendChild(d); lblEls[e.id] = d; }
  if (e.do === 'work') { const d = document.createElement('div'); d.className = 'wl' + (e.box ? ' box' : '') + (e.trap ? ' trap' : '');
    katex.render(e.tex, d, { throwOnError: false }); $('work').appendChild(d); workEls.push([e, d]); }
});
const LH = 104;
window.setT = (t) => {
  layout(t);
  const outro = S.events.find(e => e.do === 'outro');
  const inOutro = outro && t >= outro.t;
  $('main').style.display = inOutro ? 'none' : 'block'; $('outro').style.display = inOutro ? 'block' : 'none';
  $('cap').className = inOutro ? 'dark' : ''; $('cap').style.top = (inOutro ? 770 : capTop) + 'px';
  if (inOutro) {
    const f = Math.min(S.outro.frames - 1, Math.floor((t - outro.t) * S.outro.fps));
    $('oimg').src = S.outro.dir + '/o_' + String(f).padStart(4, '0') + '.jpg';
    const tp = (S.outro.taps || []).find(x => x && Math.abs(t - outro.t - x.t) < 0.5);
    $('tap').style.display = tp ? 'block' : 'none';
    if (tp) { const dt = t - outro.t - tp.t; $('tap').style.left = tp.x * 3 + 'px'; $('tap').style.top = tp.y * 3 + 'px'; $('tap').style.transform = `scale(${dt < 0 ? 1 : 1 - dt * .8})`; }
  }
  // highlights: the latest hl event wins
  let hl = null; S.events.forEach(e => { if (e.do === 'hl' && e.t <= t) hl = e; });
  Object.entries(hlEls).forEach(([k, d]) => { const on = hl && hl.on.includes(k); d.style.opacity = on ? Math.min(1, (t - hl.t) / .25) : 0; });
  S.events.forEach(e => { if (e.do === 'label') lblEls[e.id].style.opacity = Math.max(0, Math.min(1, (t - e.t) / .25)); });
  // chips
  L.slice(0, S.options.length).split('').forEach(c => $('c' + c).className = 'chip');
  S.events.forEach(e => { if (e.do === 'chip' && e.t <= t) $('c' + e.opt).className = 'chip ' + e.state; });
  // pause timer
  const tm = S.events.find(e => e.do === 'timer');
  const pz = tm && t >= tm.t && t < tm.t + tm.dur;
  $('pause').style.display = pz ? 'block' : 'none';
  if (pz) $('pause').querySelector('i').style.width = (100 * (1 - (t - tm.t) / tm.dur)) + '%';
  // working: stack lines, newest at the bottom, scroll up when full
  const shown = workEls.filter(([e]) => e.t <= t);
  const maxN = Math.floor(workH / LH);
  let k = 0;
  workEls.forEach(([e, d]) => {
    const i = shown.findIndex(s => s[1] === d);
    if (i < 0) { d.style.opacity = 0; return; }
    const a = ez((t - e.t) / .35);
    const off = Math.max(0, shown.length - maxN);
    let row = i - off;
    // smooth scroll as the newest line arrives
    const last = shown[shown.length - 1][0]; const sl = shown.length > maxN ? 1 - ez((t - last.t) / .35) : 0;
    row += sl;
    d.style.top = (row * LH) + 'px'; d.style.opacity = (row < -0.5 ? 0 : 1) * a;
    d.style.transform = `translateY(${(1 - a) * 24}px)`;
    d.classList.toggle('now', d === shown[shown.length - 1][1] && !e.trap && !e.box);
  });
  // captions: chunk of words around the current one
  const W = S.words; let ci = -1;
  for (let i = 0; i < W.length; i++) if (W[i].t0 <= t + 0.02) ci = i;
  const cur = ci >= 0 && t <= W[ci].lineEnd + 0.25 ? ci : -1;
  if (cur < 0) { $('cap').innerHTML = ''; } else {
    const ch = W[cur].chunk, ws = W.filter(w => w.chunk === ch);
    $('cap').innerHTML = '<span class="inner">' + ws.map(w => `<span class="w${w === W[cur] ? ' on' : ''}">${w.w}</span>`).join(' ') + '</span>';
  }
  return new Promise(r => { const im = $('oimg'); if (!inOutro || im.complete) requestAnimationFrame(() => r()); else im.onload = () => r(); });
};
window.READY = document.fonts.ready.then(() => new Promise(r => qimg.complete ? r() : qimg.onload = r));
</script>
</body></html>

<!DOCTYPE html>
<html><head><meta charset="utf-8">
<!-- Animated solve video frame. Each video's drawing lives in scenes/<id>.js as a pure function of time:
     SCENE(t, T, H) → SVG markup for a 1000 × 700 stage. T holds the time of every {marker} in the script. -->
<link rel="stylesheet" href="/esat/vendor/katex/katex.min.css">
<script src="/esat/vendor/katex/katex.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@500;600;700&display=block" rel="stylesheet">
<style>
:root{--paper:#f6f1e7;--ink:#1b1604;--pop:#ffc917;--ok:#1f9d55;--bad:#e0344b}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--paper);font-family:'IBM Plex Sans',sans-serif;color:var(--ink)}
body{background-image:radial-gradient(rgba(27,22,4,.08) 2px,transparent 2px);background-size:34px 34px}
#top{position:absolute;left:56px;right:56px;top:96px;height:96px;display:flex;align-items:center;gap:20px}
#top img{width:84px;height:84px;border-radius:20px;border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink)}
#top .t1{font:800 40px 'Bricolage Grotesque';line-height:1}
#top .t2{font:600 26px 'IBM Plex Sans';opacity:.7;margin-top:6px}
#tag{margin-left:auto;background:var(--pop);border:3px solid var(--ink);border-radius:999px;padding:10px 22px;font:700 27px 'IBM Plex Sans';box-shadow:0 5px 0 var(--ink);white-space:nowrap}
#qcard{position:absolute;left:40px;width:1000px;top:218px;background:#fff;border:4px solid var(--ink);border-radius:30px;box-shadow:0 9px 0 var(--ink);overflow:hidden}
#qcard .q{position:absolute;left:0;top:0;width:100%;padding:24px 32px;font:600 39px/1.32 'IBM Plex Sans'}
#qcard .q.short{font-size:34px}
#chips{position:absolute;left:40px;width:1000px;display:flex;gap:12px}
.chip{flex:1;background:#fff;border:3px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--ink);text-align:center;padding:10px 2px 8px;position:relative}
.chip b{display:block;font:800 34px 'Bricolage Grotesque';line-height:1}
.chip span{display:block;font:600 25px 'IBM Plex Sans';margin-top:4px;white-space:nowrap}
.chip.right{background:#d9f7e5;border-color:var(--ok);box-shadow:0 5px 0 var(--ok)}
.chip.right b,.chip.right span{color:#0d6b35}
.chip.wrong{background:#fde3e7;border-color:var(--bad);box-shadow:0 5px 0 var(--bad);opacity:.85}
.chip.wrong::after{content:'';position:absolute;left:10px;right:10px;top:50%;height:6px;background:var(--bad);border-radius:3px;transform:rotate(-20deg)}
.chip.right::before{content:'✓';position:absolute;top:-22px;right:-10px;width:44px;height:44px;border-radius:50%;background:var(--ok);color:#fff;font:800 28px/44px 'IBM Plex Sans'}
#stage{position:absolute;left:40px;width:1000px}
#stage svg{width:100%;height:100%;display:block;overflow:visible}
svg text{font-family:'IBM Plex Sans';font-weight:600}
#work{position:absolute;left:40px;width:930px;top:1150px;height:236px;overflow:hidden}
.wl{position:absolute;left:0;right:0;height:78px;display:flex;align-items:center;padding-left:24px;font-size:38px;border-left:8px solid transparent;white-space:nowrap}
.wl.now{border-left-color:var(--pop)}
.wl.box .katex{border:4px solid var(--ok);border-radius:14px;padding:4px 14px;background:#e8faef}
.wl.trap{color:var(--bad)}
#pause{position:absolute;left:40px;width:930px;top:1170px;display:none;text-align:center}
#pause .p1{font:800 58px 'Bricolage Grotesque'}
#pause .bar{margin:20px auto 0;width:600px;height:22px;border:4px solid var(--ink);border-radius:999px;overflow:hidden;background:#fff}
#pause .bar i{display:block;height:100%;background:var(--pop)}
#cap{position:absolute;left:50px;width:880px;top:1398px;text-align:center;font:700 50px/1.25 'IBM Plex Sans'}
#cap .w{padding:0 4px;border-radius:10px}
#cap .w.on{background:var(--pop)}
#cap.dark{color:#fff}
#cap.dark .inner{display:inline;background:rgba(20,16,3,.86);box-decoration-break:clone;-webkit-box-decoration-break:clone;padding:6px 14px;border-radius:14px;line-height:1.5}
#cap.dark .w.on{color:var(--ink)}
#outro{position:absolute;inset:0;display:none}
#outro img{width:1080px;height:1920px;display:block}
#tap{position:absolute;width:90px;height:90px;margin:-45px 0 0 -45px;border-radius:50%;background:rgba(255,201,23,.55);border:5px solid var(--ink);display:none}
</style></head>
<body>
<div id="main">
  <div id="top"><img src="/icons/icon.svg"><div><div class="t1">TrainTanmay</div><div class="t2" id="series"></div></div><div id="tag"></div></div>
  <div id="qcard"><div class="q" id="q1"></div><div class="q short" id="q2"></div></div>
  <div id="chips"></div>
  <div id="stage"></div>
  <div id="pause"><div class="p1">Pause &amp; try it ✋</div><div class="bar"><i></i></div></div>
  <div id="work"></div>
</div>
<div id="outro"><img id="oimg"><div id="tap"></div></div>
<div id="cap"></div>
<script>
const S = window.SCHED, T = S.T;
const $ = id => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ez = x => { x = clamp(x); return 1 - Math.pow(1 - x, 3); };
const ezio = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
// text with $tex$ pieces
const rich = s => s.replace(/\$([^$]+)\$/g, (_, x) => katex.renderToString(x, { throwOnError: false }));
$('series').textContent = S.series + ' · real past question';
$('tag').textContent = S.tag;
$('q1').innerHTML = rich(S.q); $('q2').innerHTML = rich(S.qShort || S.q);
const L = 'ABCDEFGH';
(S.options || []).forEach((o, i) => $('chips').insertAdjacentHTML('beforeend', `<div class="chip" id="c${L[i]}"><b>${L[i]}</b><span>${rich(o)}</span></div>`));
const workEls = [];
S.events.forEach(e => { if (e.do === 'work') { const d = document.createElement('div'); d.className = 'wl' + (e.box ? ' box' : '') + (e.trap ? ' trap' : '');
  katex.render(e.tex, d, { throwOnError: false }); $('work').appendChild(d); workEls.push([e, d]); } });

/* ---------- drawing helpers for scenes ---------- */
const C = { ink: '#1b1604', pop: '#ffc917', ok: '#1f9d55', bad: '#e0344b', blue: '#2563eb', grey: '#a8a29e', soft: '#fff7d6', paper: '#fff' };
const at = (o) => Object.entries(o).filter(([k, v]) => v !== undefined && v !== null).map(([k, v]) => `${k.replace(/[A-Z]/g, m => '-' + m.toLowerCase())}="${v}"`).join(' ');
const dist = (a, b) => Math.hypot(b[0] - a[0], b[1] - a[1]);
const H = {
  C, clamp, ez, ezio,
  k: (t0, d = .6) => t0 === undefined ? 0 : ez((window.__t - t0) / d),          // eased 0→1 from t0 over d s
  lin: (t0, d = 1) => t0 === undefined ? 0 : clamp((window.__t - t0) / d),
  on: (t0) => t0 !== undefined && window.__t >= t0,
  len: pts => pts.slice(1).reduce((s, p, i) => s + dist(pts[i], p), 0),
  along(pts, f) { // point at fraction f of the polyline length
    let L = H.len(pts) * clamp(f);
    for (let i = 1; i < pts.length; i++) { const d = dist(pts[i - 1], pts[i]); if (L <= d) { const u = d ? L / d : 0; return [pts[i - 1][0] + (pts[i][0] - pts[i - 1][0]) * u, pts[i - 1][1] + (pts[i][1] - pts[i - 1][1]) * u]; } L -= d; }
    return pts[pts.length - 1];
  },
  part(pts, p) { // first p (0..1) of the polyline
    if (p >= 1) return pts; if (p <= 0) return [pts[0]];
    let L = H.len(pts) * p; const out = [pts[0]];
    for (let i = 1; i < pts.length; i++) { const d = dist(pts[i - 1], pts[i]); if (L <= d) { out.push(H.along([pts[i - 1], pts[i]], d ? L / d : 0)); return out; } out.push(pts[i]); L -= d; }
    return out;
  },
  pl(pts, p = 1, o = {}) { if (p <= 0) return ''; const q = H.part(pts, p);
    return `<polyline points="${q.map(x => x.join(',')).join(' ')}" ${at({ fill: 'none', stroke: C.ink, strokeWidth: 5, strokeLinecap: 'round', strokeLinejoin: 'round', ...o })}/>`; },
  ln: (x1, y1, x2, y2, p = 1, o = {}) => H.pl([[x1, y1], [x2, y2]], p, o),
  tx: (x, y, s, o = {}) => `<text ${at({ x, y, fontSize: 30, fill: C.ink, textAnchor: 'middle', dominantBaseline: 'middle', ...o })}>${s}</text>`,
  ci: (x, y, r, o = {}) => `<circle ${at({ cx: x, cy: y, r, fill: C.paper, stroke: C.ink, strokeWidth: 5, ...o })}/>`,
  re: (x, y, w, h, o = {}) => `<rect ${at({ x, y, width: w, height: h, rx: 6, fill: C.paper, stroke: C.ink, strokeWidth: 5, ...o })}/>`,
  pill(x, y, s, o = {}) { const sz = o.size || 30, w = (o.w || s.replace(/<[^>]+>/g, '').length * sz * .58) + sz * .9, h = sz * 1.55, op = o.opacity === undefined ? 1 : o.opacity, sc = o.scale || 1;
    if (op <= 0) return '';
    return `<g opacity="${op}" transform="translate(${x},${y}) scale(${sc})"><rect x="${-w / 2}" y="${-h / 2}" width="${w}" height="${h}" rx="${h / 2}" fill="${o.bg || C.ink}" stroke="${o.stroke || 'none'}" stroke-width="4"/>` +
      `<text x="0" y="1" font-size="${sz}" fill="${o.fg || '#fff'}" text-anchor="middle" dominant-baseline="middle" font-weight="700">${s}</text></g>`; },
  ar(x1, y1, x2, y2, p = 1, o = {}) { if (p <= 0) return ''; const [ex, ey] = H.along([[x1, y1], [x2, y2]], p), a = Math.atan2(y2 - y1, x2 - x1), s = o.head || 18, c = o.stroke || C.ink;
    return H.ln(x1, y1, ex, ey, 1, o) + `<polygon points="${ex},${ey} ${ex - s * Math.cos(a - .45)},${ey - s * Math.sin(a - .45)} ${ex - s * Math.cos(a + .45)},${ey - s * Math.sin(a + .45)}" fill="${c}"/>`; },
  g: (op, inner, tr = '') => op <= 0 ? '' : `<g opacity="${clamp(op)}" ${tr ? `transform="${tr}"` : ''}>${inner}</g>`,
  pop: (t0) => { if (t0 === undefined || window.__t < t0) return 0; const x = (window.__t - t0) / .35; return x >= 1 ? 1 : 1 + .25 * Math.sin(Math.PI * x) * (1 - x) + (x - 1) * 0; },
};
const scene = window.SCENES[S.scene];

/* ---------- layout ---------- */
const qH1 = () => $('q1').offsetHeight, qH2 = () => $('q2').offsetHeight;
function layout(t) {
  const c = T.compact !== undefined ? ez((t - T.compact) / .6) : 0;
  const h = qH1() + (qH2() - qH1()) * c;
  $('qcard').style.height = h + 'px'; $('q1').style.opacity = 1 - c; $('q2').style.opacity = c;
  let y = 218 + h + 26;
  if ((S.options || []).length) { $('chips').style.top = y + 'px'; y += 118; }
  const bottom = 1136; $('stage').style.top = y + 'px'; $('stage').style.height = (bottom - y) + 'px';
}
const LH = 78, maxN = 3;
window.setT = (t) => {
  window.__t = t; layout(t);
  const outro = T.outro; const inOutro = outro !== undefined && t >= outro;
  $('main').style.display = inOutro ? 'none' : 'block'; $('outro').style.display = inOutro ? 'block' : 'none';
  $('cap').className = inOutro ? 'dark' : ''; $('cap').style.top = (inOutro ? 770 : 1398) + 'px';
  if (inOutro && S.outro && S.outro.frames) {
    const f = Math.min(S.outro.frames - 1, Math.floor((t - outro) * S.outro.fps));
    $('oimg').src = S.outro.dir + '/o_' + String(f).padStart(4, '0') + '.jpg';
    const tp = (S.outro.taps || []).find(x => x && Math.abs(t - outro - x.t) < 0.5);
    $('tap').style.display = tp ? 'block' : 'none';
    if (tp) { const dt = t - outro - tp.t; $('tap').style.left = tp.x * 3 + 'px'; $('tap').style.top = tp.y * 3 + 'px'; $('tap').style.transform = `scale(${dt < 0 ? 1 : Math.max(.2, 1 - dt * .8)})`; }
  }
  if (!inOutro) $('stage').innerHTML = `<svg viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid meet">${scene(t, T, H)}</svg>`;
  (S.options || []).forEach((o, i) => $('c' + L[i]).className = 'chip');
  S.events.forEach(e => { if (e.do === 'chip' && e.t <= t) $('c' + e.opt).className = 'chip ' + e.state; });
  const tm = S.events.find(e => e.do === 'timer'); const pz = tm && t >= tm.t && t < tm.t + tm.dur;
  $('pause').style.display = pz ? 'block' : 'none';
  if (pz) $('pause').querySelector('i').style.width = (100 * (1 - (t - tm.t) / tm.dur)) + '%';
  const shown = workEls.filter(([e]) => e.t <= t);
  workEls.forEach(([e, d]) => {
    const i = shown.findIndex(s => s[1] === d); if (i < 0) { d.style.opacity = 0; return; }
    const a = ez((t - e.t) / .35), last = shown[shown.length - 1][0];
    const row = i - Math.max(0, shown.length - maxN) + (shown.length > maxN ? 1 - ez((t - last.t) / .35) : 0);
    d.style.top = (row * LH) + 'px'; d.style.opacity = (row < -0.5 ? 0 : 1) * a; d.style.transform = `translateY(${(1 - a) * 20}px)`;
    d.classList.toggle('now', d === shown[shown.length - 1][1] && !e.trap && !e.box);
  });
  const W = S.words; let ci = -1;
  for (let i = 0; i < W.length; i++) if (W[i].t0 <= t + 0.02) ci = i;
  const cur = ci >= 0 && t <= W[ci].lineEnd + 0.25 ? ci : -1;
  if (cur < 0) $('cap').innerHTML = ''; else {
    const ws = W.filter(w => w.chunk === W[cur].chunk);
    $('cap').innerHTML = '<span class="inner">' + ws.map(w => `<span class="w${w === W[cur] ? ' on' : ''}">${w.w}</span>`).join(' ') + '</span>';
  }
  return new Promise(r => { const im = $('oimg'); if (!inOutro || im.complete) requestAnimationFrame(() => r()); else im.onload = () => r(); });
};
window.READY = document.fonts.ready;
</script>
</body></html>

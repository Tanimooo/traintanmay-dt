<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>TrainTanmay Physics</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700;800&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&family=STIX+Two+Text:ital,wght@0,400;0,600;1,400;1,600&display=swap">
<style>
/* Layout concept: a physics lab notebook in pink — graph-paper grid, oscilloscope-trace accents, the same workbook structure as the DT site. */
:root{
  --bg:#fbf3f7; --surface:#ffffff; --surface-2:#f7e8f0; --line:#efd6e3; --line-strong:#dcb5c9;
  --ink:#2a0f1e; --ink-2:#5b3449; --muted:#896276;
  --brand:#c81e66; --brand-ink:#ffffff; --deep:#5f0f37; --brand-soft:#fde2ee;
  --accent:#6f46cf; --accent-soft:#ece6fb; --teal:#0b857c; --teal-soft:#d9f2ee;
  --good:#1f8a5b; --good-soft:#e0f3ea; --warn:#a86a10; --warn-soft:#fbf0d9; --bad:#c2413a; --bad-soft:#f9e3e1;
  --grid:rgba(200,30,102,.075); --shadow:0 1px 2px rgba(60,10,35,.06),0 6px 20px rgba(60,10,35,.07);
  --f-display:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px; --r-sm:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]):not([data-theme="blush"]){
  --bg:#160910; --surface:#211019; --surface-2:#2b1522; --line:#43233a; --line-strong:#5e3350;
  --ink:#fbe9f2; --ink-2:#e3c1d3; --muted:#b28ca2;
  --brand:#ff5c9e; --brand-ink:#220010; --logo-t:#7a0f40; --deep:#ffb1d0; --brand-soft:#45192f;
  --accent:#ac90ff; --accent-soft:#2c2348; --teal:#42d3c4; --teal-soft:#113531;
  --good:#46c08a; --good-soft:#133326; --warn:#e2b04f; --warn-soft:#33290f; --bad:#f07a72; --bad-soft:#3a1b19;
  --grid:rgba(255,92,158,.075); --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#160910; --surface:#211019; --surface-2:#2b1522; --line:#43233a; --line-strong:#5e3350;
  --ink:#fbe9f2; --ink-2:#e3c1d3; --muted:#b28ca2;
  --brand:#ff5c9e; --brand-ink:#220010; --logo-t:#7a0f40; --deep:#ffb1d0; --brand-soft:#45192f;
  --accent:#ac90ff; --accent-soft:#2c2348; --teal:#42d3c4; --teal-soft:#113531;
  --good:#46c08a; --good-soft:#133326; --warn:#e2b04f; --warn-soft:#33290f; --bad:#f07a72; --bad-soft:#3a1b19;
  --grid:rgba(255,92,158,.075); --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3); color-scheme:dark}
:root[data-theme="blush"]{
  --bg:#f7dbe7; --surface:#fdf0f5; --surface-2:#f2cfdf; --line:#e6b9cd; --line-strong:#d697b4;
  --ink:#2c0c1c; --ink-2:#5a2440; --muted:#83506a;
  --brand:#b0155a; --brand-ink:#ffffff; --deep:#5a0c33; --brand-soft:#f5c9dc;
  --accent:#5b39b4; --accent-soft:#e5dcf7; --teal:#08756d; --teal-soft:#cfeae5;
  --good:#2c7a4e; --good-soft:#e2ecd9; --warn:#8e5a10; --warn-soft:#f5e2c4; --bad:#a8382f; --bad-soft:#f4d2cb;
  --grid:rgba(176,21,90,.07); --shadow:0 1px 2px rgba(60,10,35,.07),0 6px 20px rgba(60,10,35,.08); color-scheme:light}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;margin:0;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
a{color:var(--brand)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:4px}
h1,h2,h3,h4{font-family:var(--f-display);letter-spacing:.01em;line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(2rem,4.2vw,3rem);font-weight:800}
h2{font-size:clamp(1.45rem,2.6vw,1.9rem);font-weight:700}
h3{font-size:1.3rem;font-weight:700}
h4{font-size:1.05rem;font-weight:700}
sub,sup{line-height:0}
.eyebrow{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.eyebrow a{color:inherit}
.muted{color:var(--muted)}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:14px;height:60px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);flex:none}
.brand svg{width:38px;height:38px}
.brand b{font-family:var(--f-display);font-size:1.3rem;font-weight:800;line-height:1}
.brand small{display:block;font-family:var(--f-mono);font-size:.62rem;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;margin-top:3px}
.nav{display:flex;gap:2px;margin-left:14px;overflow-x:auto;scrollbar-width:none;align-items:center}
.nav::-webkit-scrollbar{display:none}
.nav a{display:inline-flex;align-items:center;padding:8px 9px;border-radius:9px;text-decoration:none;color:var(--ink-2);font-weight:600;font-size:.88rem;white-space:nowrap;transition:background .2s,color .2s}
.nav a svg{width:21px;height:21px;flex:none}
.nav a .nl{display:inline-block;max-width:0;opacity:0;overflow:hidden;margin-left:0;transition:max-width .28s ease,opacity .2s ease,margin-left .28s ease}
.nav a:hover .nl,.nav a:focus-visible .nl,.nav a[aria-current="page"] .nl{max-width:150px;opacity:1;margin-left:7px}
@media (prefers-reduced-motion:reduce){.nav a .nl{transition:none}}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--brand-soft);color:var(--brand);font-weight:600}
.tb-right{margin-left:auto;display:flex;gap:8px;align-items:center;flex:none}
.iconbtn{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:9px;border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--ink-2);text-decoration:none}
.iconbtn:hover{border-color:var(--line-strong);color:var(--ink)}
.iconbtn svg{width:19px;height:19px}
.menubtn{display:none}
@media (max-width:1100px){.nav{display:none}.menubtn{display:inline-grid}}
@media (max-width:520px){.theme-select{display:none}.brand small{display:none}}
.drawer{position:fixed;inset:0;z-index:80;background:rgba(20,5,12,.45);display:flex;justify-content:flex-end}
.drawer[hidden]{display:none}
.drawer-panel{width:min(320px,86vw);background:var(--surface);height:100%;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 16px 16px;display:flex;flex-direction:column;gap:4px;overflow:auto}
.drawer-panel a{padding:12px;border-radius:8px;text-decoration:none;color:var(--ink);font-weight:500}
.drawer-panel a[aria-current="page"]{background:var(--brand-soft);color:var(--brand)}
.theme-select{height:38px;border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:0 8px;font-size:.88rem;color:var(--ink-2)}
main{padding-block:24px 80px}
/* generic */
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:9px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);font-weight:600;cursor:pointer;text-decoration:none;font-size:.95rem;line-height:1.2}
.btn:hover{border-color:var(--brand);color:var(--brand)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{filter:brightness(1.08);color:var(--brand-ink)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn-sm{padding:6px 11px;font-size:.85rem;border-radius:7px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:16px;height:16px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:.78rem;font-weight:600;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line);white-space:nowrap}
.chip.brand{background:var(--brand-soft);color:var(--brand);border-color:transparent}
.chip.ai{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chip.teal{background:var(--teal-soft);color:var(--teal);border-color:transparent}
.chip.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr))}
.g4{grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted)}
.field select,.field input{height:38px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:0 10px;color:var(--ink);font-size:.93rem}
input[type=search],input[type=text],input[type=number],textarea{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:9px 11px;color:var(--ink)}
textarea{width:100%;min-height:130px;resize:vertical;line-height:1.55}
.toggle{display:inline-flex;align-items:center;gap:10px;cursor:pointer;user-select:none;font-weight:600;font-size:.9rem;color:var(--ink-2)}
.toggle input{appearance:none;width:42px;height:24px;border-radius:999px;background:var(--line-strong);position:relative;cursor:pointer;transition:background .2s;margin:0;flex:none}
.toggle input::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.toggle input:checked{background:var(--brand)}
.toggle input:checked::after{transform:translateX(18px)}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--brand);border-radius:99px}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line-strong);border-radius:var(--r)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--deep);color:var(--bg);padding:10px 16px;border-radius:9px;font-weight:600;z-index:200;box-shadow:var(--shadow);max-width:90vw}
/* hero */
.hero{position:relative;border:1px solid var(--line);border-radius:16px;background:var(--surface);overflow:hidden;display:grid;grid-template-columns:1.1fr .9fr;min-height:320px}
.hero::before{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;pointer-events:none}
.hero-text{position:relative;padding:34px 30px;display:flex;flex-direction:column;gap:16px;justify-content:center}
.hero-text p{max-width:52ch;color:var(--ink-2);margin:0}
.hero-shuttle{background:#0b1a3d;display:block;text-decoration:none;overflow:hidden;cursor:pointer}
.hero-shuttle .shuttle-svg{position:absolute;inset:0;width:100%;height:100%}
.sh-craft{transition:transform .5s cubic-bezier(.2,.8,.2,1);animation:shFloat 6s ease-in-out infinite;transform-box:view-box}
.sh-flame{transform-origin:72px 130px;animation:shFlame 1.6s ease-in-out infinite;transform-box:view-box}
@keyframes shFloat{0%,100%{translate:0 0}50%{translate:0 -6px}}
@keyframes shFlame{0%,100%{transform:scaleX(1)}50%{transform:scaleX(1.18)}}
.hero-shuttle:hover .sh-craft,.hero-shuttle:focus-visible .sh-craft{translate:14px -10px}
.hero-shuttle:hover .sh-flame{transform:scaleX(1.5)}
.sh-cta{position:absolute;left:12px;right:12px;bottom:10px;font-family:var(--f-mono);font-size:.74rem;letter-spacing:.06em;color:#ffc6dd;text-align:center}
.hero-shuttle:hover .sh-cta{color:#fff}
@media (max-width:560px){.sh-cta{display:none}}
@media (prefers-reduced-motion:reduce){.sh-craft,.sh-flame{animation:none!important;transition:none!important}}
.featlab{display:block;margin:16px 0 18px;padding:20px 22px;border-radius:14px;text-decoration:none;color:#fff;background:#12060c radial-gradient(circle at 85% 30%,rgba(255,92,158,.45),transparent 55%);border:1px solid var(--deep)}
.featlab h2{color:#fff;margin:4px 0 6px}.featlab p{color:#ffd6e8;margin:0 0 12px;max-width:70ch}.featlab .eyebrow{color:#ff9cc4}
.featlab:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.hero-scopewrap{display:flex;flex-direction:column;margin:18px;gap:10px}
.scope-q{border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--surface);font-size:.9rem}
.scope-q summary{cursor:pointer}
.scope-q p{margin:8px 0 0}
.hero-scope{position:relative;min-height:260px;margin:0;border-radius:12px;background:#12060c;border:6px solid var(--deep);box-shadow:inset 0 0 40px rgba(255,92,158,.15)}
.hero-scope canvas{position:absolute;inset:0;width:100%;height:100%}
.scope-lbl{position:absolute;left:12px;bottom:8px;font-family:var(--f-mono);font-size:.68rem;color:#ff9cc4;letter-spacing:.08em}
@media (max-width:820px){.hero{grid-template-columns:1fr}.hero-scope{min-height:200px}.hero-scopewrap{order:-1}.hero-text{padding:22px 18px}}
.pun{transition:opacity .45s ease,transform .45s cubic-bezier(.2,.8,.2,1);cursor:pointer;min-height:2.3em;font-family:var(--f-display);font-size:1.25rem;font-weight:600;color:var(--brand)}
.pun.out{opacity:0;transform:translateY(14px)}
.pun.pre{opacity:0;transform:translateY(-14px);transition:none}
.statrow{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media (max-width:700px){.statrow{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.stat b{display:block;font-family:var(--f-display);font-size:1.9rem;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:.82rem;color:var(--muted)}
/* modules and topic cards */
.mod{display:flex;flex-direction:column;gap:10px}
.mod-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.mnum{font-family:var(--f-display);font-weight:800;font-size:1.7rem;color:var(--brand);min-width:2ch}
.tcard{display:flex;flex-direction:column;gap:8px;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;transition:border-color .15s,transform .2s,box-shadow .2s}
.tcard:hover{border-color:var(--brand);transform:translateY(-2px);box-shadow:var(--shadow)}
.tcard .id{font-family:var(--f-mono);font-size:.78rem;color:var(--muted)}
.tcard h4{font-family:var(--f-body);font-weight:600;font-size:1rem;line-height:1.3}
.tcard p{margin:0;font-size:.86rem;color:var(--ink-2)}
.tcard .meta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.8rem;color:var(--muted);margin-top:auto}
.rag{width:10px;height:10px;border-radius:50%;background:var(--line-strong);display:inline-block}
.rag.r{background:var(--bad)}.rag.a{background:var(--warn)}.rag.g{background:var(--good)}
/* topic page */
.tp-head{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:end;margin-bottom:16px}
@media (max-width:700px){.tp-head{grid-template-columns:1fr}}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:thin;margin-bottom:20px}
.tabs button{border:0;background:none;padding:11px 14px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;font-size:.93rem}
.tabs button[aria-selected="true"]{color:var(--brand);border-bottom-color:var(--brand)}
.tabs button .n{font-family:var(--f-mono);font-size:.72rem;margin-left:5px;color:var(--muted)}
.tp-layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:start}
.tp-layout.solo{grid-template-columns:minmax(0,1fr)}.tp-layout.solo>.side{display:none}
@media (max-width:960px){.tp-layout{grid-template-columns:1fr}}
.side{position:sticky;top:76px;display:flex;flex-direction:column;gap:14px}
@media (max-width:960px){.side{position:static}}
.specbox ol{margin:6px 0 0;padding-left:20px}
.specbox li{margin-bottom:6px;font-size:.9rem}
.conf{display:flex;gap:6px;margin-top:4px}
.conf button{flex:1;padding:7px 4px;border-radius:7px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:.8rem}
.conf button[aria-pressed="true"].r{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.conf button[aria-pressed="true"].a{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.conf button[aria-pressed="true"].g{background:var(--good-soft);color:var(--good);border-color:var(--good)}
/* notes */
.notes{max-width:80ch;font-size:1.02rem;min-width:0}
.notes h2{margin:30px 0 10px;font-size:1.55rem;padding-bottom:6px;border-bottom:2px solid var(--line)}
.notes h2:first-child{margin-top:0}
.notes h3{margin:22px 0 8px}
.notes p{margin:0 0 12px}
.notes ul,.notes ol{margin:0 0 14px;padding-left:22px}
.notes li{margin-bottom:5px}
.notes strong{color:var(--deep)}
.psw{display:flex;gap:10px;align-items:flex-start;margin:14px 0 12px;padding:10px 14px;border:1px solid color-mix(in srgb,var(--brand) 35%,var(--line));background:color-mix(in srgb,var(--brand) 7%,var(--surface));border-radius:var(--r-sm);font-size:.88rem}.psw svg{width:20px;height:20px;flex:none;color:var(--brand);margin-top:1px}.psw p{margin:0}
.tbl{overflow-x:auto;margin:14px 0 18px;border:1px solid var(--line);border-radius:var(--r-sm)}
.tbl table{border-collapse:collapse;width:100%;font-size:.9rem;min-width:480px}
.tbl th,.tbl td{padding:9px 11px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
.tbl th{background:var(--surface-2);font-family:var(--f-display);font-size:.98rem;letter-spacing:.02em;font-weight:700}
.tbl tr:last-child td{border-bottom:0}
.tbl.fit table{min-width:0}.tbl.fit td,.tbl.fit th{padding:8px 9px}.tbl.fit td:last-child{white-space:nowrap}
.sheetg{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}@media(max-width:760px){.sheetg{grid-template-columns:minmax(0,1fr)}.tbl.fit td:last-child{white-space:normal}.tbl.fit td,.tbl.fit th{padding:7px 7px;font-size:.85rem}}
.tbl td:first-child{font-weight:600}
blockquote.tip{margin:16px 0;padding:12px 16px;border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:0 8px 8px 0}
blockquote.tip p{margin:0}
.eqgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;margin:10px 0 16px}
.eqgrid div{font-family:var(--f-mono);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;text-align:center;font-weight:600}
.emspec{display:flex;border-radius:8px;overflow:hidden;margin:6px 0 16px;font-size:.78rem;text-align:center}
.emspec span{flex:1;padding:8px 2px;background:hsl(calc(330 - var(--h)*38) 70% 88%);color:#2a0f1e;line-height:1.25}
.emspec small{font-family:var(--f-mono);font-size:.62rem;opacity:.8}
/* inline SVG diagrams */
.diagram{width:100%;max-width:600px;height:auto;margin:10px 0 14px;color:var(--ink);display:block}
.diagram text{font:13px var(--f-mono);fill:var(--ink)}
.diagram .small{font-size:12px;fill:var(--ink-2)}
.diagram .ax{stroke:var(--ink-2);stroke-width:1.6;fill:none}

.diagram .c1{stroke:var(--brand);stroke-width:2.8;fill:none}
.diagram .c2{stroke:var(--accent);stroke-width:2.4;fill:none}
.diagram .c3{stroke:var(--teal);stroke-width:2.4;fill:none}
.diagram .thick{stroke-width:3.2}
.diagram .dash{stroke-dasharray:6 5}
.diagram .dimline{stroke:var(--muted);stroke-width:1.2;fill:none}
.diagram .fillsoft{fill:var(--brand-soft)}
.diagram .fill1{fill:var(--brand)}
.diagram .fill2{fill:var(--surface-2)}
.diagram .pt circle{fill:var(--brand)}
.diagram .pt line{stroke:var(--ink-2);stroke-width:1.4}
.diagram .lbl1{fill:var(--brand)}.diagram .lbl2{fill:var(--accent)}.diagram .lbl3{fill:var(--teal)}
.diagram .lblw{fill:#fff;font-weight:700;font-size:16px}
.diagram .dot{fill:var(--ink)}.diagram .dotb{fill:var(--brand)}.diagram .dota{fill:var(--accent)}
.diagram .fringes rect{fill:var(--brand)}
.diagram .bdots circle{fill:var(--muted)}
.diagram .msband{fill:var(--brand-soft);stroke:var(--brand);stroke-width:1}
.diagram .giantz{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1}
.diagram .dwarfz{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1}
.diagram .sun{fill:#f4b400;stroke:var(--ink);stroke-width:1}
/* equations, terms */
.eqlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:10px}
.eq{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.eq b{font-family:var(--f-mono);font-size:1.05rem;color:var(--deep);font-weight:600}
.eq span{font-size:.86rem;color:var(--muted)}
.terms{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:12px}
.term{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.term b{font-family:var(--f-display);font-size:1.12rem;display:block;margin-bottom:4px;color:var(--deep)}
.term p{margin:0;font-size:.93rem;color:var(--ink-2)}
/* flashcards */
.fc-stage{perspective:1400px;max-width:680px;margin:0 auto}
.fc{position:relative;height:280px;cursor:pointer;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.2,.7,.2,1)}
.fc.flip{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:14px;border:1px solid var(--line);background:var(--surface);padding:26px;display:flex;flex-direction:column;justify-content:center;gap:12px;box-shadow:var(--shadow);overflow:auto}
.fc-face.back{transform:rotateY(180deg);background:var(--brand-soft)}
.fc-face .q{font-family:var(--f-display);font-size:clamp(1.25rem,2.6vw,1.6rem);font-weight:700;line-height:1.25}
.fc-face .a{font-size:1.05rem}
.fc-face .eyebrow{position:absolute;top:14px;left:20px}
.fc-controls{display:flex;justify-content:center;gap:10px;margin-top:16px;flex-wrap:wrap}
.boxes{display:flex;gap:6px;justify-content:center;margin:10px 0 18px;flex-wrap:wrap}
.boxes span{font-family:var(--f-mono);font-size:.75rem;padding:4px 8px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line)}
/* quiz */
.qz{max-width:760px;margin:0 auto}
.qz-q{font-family:var(--f-display);font-size:1.35rem;font-weight:700;line-height:1.3;margin:8px 0 16px}
.qz-opts{display:flex;flex-direction:column;gap:10px}
.qz-opts button{text-align:left;padding:13px 16px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-size:1rem;display:flex;gap:12px;align-items:flex-start}
.qz-opts button:hover:not(:disabled){border-color:var(--brand)}
.qz-opts button .l{font-family:var(--f-mono);font-weight:600;color:var(--muted)}
.qz-opts button.right{border-color:var(--good);background:var(--good-soft)}
.qz-opts button.wrong{border-color:var(--bad);background:var(--bad-soft)}
.qz-exp{margin-top:14px;padding:12px 16px;border-radius:10px;background:var(--surface-2)}
/* exam questions */
.ql{display:flex;flex-direction:column;gap:10px}
.qitem{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:13px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);text-decoration:none;color:var(--ink)}
.qitem:hover{border-color:var(--brand)}
.qitem .qid{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);min-width:76px}
.qitem .qt{font-size:.94rem;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.qitem .qm{font-family:var(--f-mono);font-weight:600;font-size:.85rem;text-align:right;white-space:nowrap}
@media (max-width:620px){.qitem{grid-template-columns:1fr auto}.qitem .qid{grid-column:1/-1}}
.exam{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:18px;align-items:start}
@media (max-width:980px){.exam{grid-template-columns:1fr}}
.paper{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);min-width:0}

.part{border-top:1px dashed var(--line-strong);padding-top:12px;margin-top:12px}

.part textarea{min-height:90px}
.ms{background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r);overflow:hidden}
.ms-head{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--surface-2);border-bottom:1px solid var(--line-strong);gap:10px;flex-wrap:wrap}

.veil{position:relative}

.selfmark{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 14px;border-top:1px solid var(--line);background:var(--surface-2)}
.selfmark input{width:70px}
.aimark{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;background:var(--surface);font-size:.93rem;margin-top:10px}
.aimark p{margin:0 0 8px}
.filters{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:16px}
.filters .field{min-width:0;max-width:100%}.filters select,.filters input{max-width:100%}
/* labs */
.labcard{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;text-decoration:none;color:var(--ink);transition:transform .2s,box-shadow .2s,border-color .2s}
.labcard:hover{border-color:var(--brand);transform:translateY(-2px);box-shadow:var(--shadow)}
.labcard .thumb{height:110px;background:var(--surface-2);display:grid;place-items:center;border-bottom:1px solid var(--line);position:relative;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:16px 16px}
.labcard .thumb svg{width:84px;height:84px;color:var(--brand)}
.labcard .txt{padding:0 16px 16px;display:flex;flex-direction:column;gap:4px}
.labcard .txt p{margin:0;font-size:.86rem;color:var(--muted)}
.lab{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
.lab-ctrl{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:flex-end;margin-bottom:14px}
.lab-ctrl label{display:flex;flex-direction:column;gap:4px;font-size:.82rem;color:var(--muted);font-weight:500}
.lab-ctrl label.toggle{flex-direction:row;align-items:center;font-size:.86rem}
.lab-ctrl input[type=range]{width:170px;max-width:100%;accent-color:var(--brand)}
.lab-ctrl select,.lab-ctrl input[type=text]{height:36px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:0 8px;color:var(--ink);max-width:100%}
.lab canvas.stage{width:100%;display:block;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);touch-action:none;margin-bottom:6px}
.plotwrap{margin-top:12px}
.readout{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.readout div{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 12px;min-width:120px}
.readout b{display:block;font-family:var(--f-mono);font-size:1.05rem;font-variant-numeric:tabular-nums}
.readout span{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.lab-note{font-size:.92rem;color:var(--ink-2);margin-top:14px;max-width:82ch;padding:12px 14px;background:var(--brand-soft);border-radius:8px}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tool{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:.82rem;font-weight:600;color:var(--ink-2)}
.tool .ti{font-family:var(--f-mono);font-size:.9rem;color:var(--brand);min-width:1.4em;text-align:center}
.tool[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.tool[aria-pressed="true"] .ti{color:var(--brand-ink)}
.inspector{margin-top:10px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}
.inspector p{margin:0}
.insp-head{margin-bottom:8px;font-family:var(--f-display);font-size:1.1rem}
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.subtabs button{padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:.88rem}
.subtabs button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.pagtbl table{min-width:420px;font-family:var(--f-mono);font-size:.84rem}

.pagtbl td:first-child{font-weight:600}
.pagcap{display:flex;gap:12px;align-items:flex-start;margin:8px 0 12px;padding:10px 14px;border-radius:10px;background:var(--brand-soft);border:1px solid var(--line);min-height:52px}
.pagcap p{margin:0;line-height:1.45;font-size:.95rem}
.pc-steps{display:flex;gap:4px;flex:none;padding-top:2px}

.pc-steps span{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:.75rem;font-weight:700;background:var(--surface);color:var(--muted);border:1px solid var(--line)}
.pc-steps span.done{background:var(--brand);color:#fff;border-color:var(--brand);opacity:.55}

.pr-row{display:flex;gap:10px 16px;flex-wrap:wrap;font-family:var(--f-mono);font-size:.88rem}
.pr-row span{color:var(--muted)}
.methodlist{counter-reset:s;list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
.methodlist li{counter-increment:s;display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start}
.methodlist li::before{content:counter(s);width:30px;height:30px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:.85rem}
/* papers */
.paperset{display:flex;flex-direction:column;gap:6px}
.sess{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}

.packgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:8px}
.pack{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);text-decoration:none;color:var(--ink);font-size:.9rem}

.pack small{font-family:var(--f-mono);font-size:.7rem;color:var(--muted)}
details.fold{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:0}

mark{background:var(--warn-soft);color:inherit;border-radius:3px;padding:0 2px}
.footer{border-top:1px solid var(--line);padding-block:22px;color:var(--muted);font-size:.85rem}
.ring{--p:0;width:60px;height:60px;border-radius:50%;background:conic-gradient(var(--brand) calc(var(--p)*1%),var(--surface-2) 0);display:grid;place-items:center;flex:none}

.lab-grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}

/* dyslexia-friendly font */
@font-face{font-family:"OpenDyslexic";src:url(fonts/opendyslexic-latin-400-normal.woff2) format("woff2");font-weight:400 500;font-display:swap}
@font-face{font-family:"OpenDyslexic";src:url(fonts/opendyslexic-latin-700-normal.woff2) format("woff2");font-weight:600 900;font-display:swap}

.dysbtn{font-weight:700;font-size:.95rem}
.dysbtn[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.sep{height:1px;background:var(--line);margin:26px 0}
.vsec{margin:0 0 22px}.vsec h3{margin:0 0 10px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}.vkind{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;margin:12px 0 8px}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.vgrid>.vtile{animation:riseIn .6s cubic-bezier(.2,.8,.2,1) both}

.vthumb{position:relative;aspect-ratio:16/9;overflow:hidden}

.vtile:hover .vthumb img{transform:scale(1.06)}

.vplay span{width:52px;height:52px;border-radius:50%;background:rgba(0,0,0,.55);display:grid;place-items:center;transition:transform .3s,background .3s}

.vbadge{position:absolute;left:8px;top:8px;background:var(--brand);color:#fff;font-size:.66rem;font-weight:700;padding:3px 7px;border-radius:999px;letter-spacing:.03em}
.vmeta{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px}

.vmeta small{color:var(--muted);font-size:.74rem;text-transform:uppercase;letter-spacing:.05em}
.vmodal{position:fixed;inset:0;z-index:160;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(20,2,10,0);transition:background .35s ease}
.vmodal.open{background:rgba(20,2,10,.72)}
.vbox{width:min(960px,100%);background:var(--surface);border-radius:14px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.4);transform:scale(.6);opacity:0;transition:transform .45s cubic-bezier(.2,.9,.25,1.05),opacity .3s ease}

.vframe{display:block;position:relative;aspect-ratio:16/9;background:linear-gradient(135deg,var(--deep),var(--brand))}

.vbar{display:flex;gap:10px;align-items:center;padding:10px 14px;flex-wrap:wrap}
